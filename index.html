<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DexHub</title>
    <link rel="icon" href="./img/ChatGPT Image 5. Nov. 2025, 11_17_15.png">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="initKeyboardControls()">

    <header id="main-header">
        <h1 onclick="goHome()" id="dexhub-link">DexHub</h1>
        <input type="text" id="search-input" placeholder="Suche Pokémon" oninput="filterPokemon()"
            aria-label="Pokémon suchen">
    </header>

    <main class="myMain" role="main">
        <div id="pokemon-container" aria-live="polite" aria-label="Liste der Pokémon"></div>
        <div id="modal-container" aria-hidden="true"></div>

        <div id="load-more-wrap">
            <button id="load-more-btn" onclick="loadMorePokemon()" aria-label="Mehr Pokémon laden">Load More</button>
        </div>
    </main>

    <footer id="site-footer">
        <p>© 2025 DexHub — Alle Rechte vorbehalten.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="templates.js"></script>
    <script src="script.js"></script>
</body>

</html>
